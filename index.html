    <header>

    <main>
        
        <!-- Source naam voor dit element: Nienke Buursink -->
        <rubiks>
            <!-- front top left -->
            <cube>
                <front></front>
                <back></back>
                <top></top>
                <bottom></bottom>
                <left></left>
                <right></right>
            </cube>

            </cube>


            <!-- back top left -->
